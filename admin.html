<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin | Raquel Corrêa Psicóloga</title>
<meta name="robots" content="noindex, nofollow">

<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500,600&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">

<link rel="stylesheet" href="css/styles.css">
<link rel="stylesheet" href="css/admin.css">
</head>
<body class="admin-body">

<!-- ===================== LOGIN ===================== -->
<section class="admin-login" id="loginScreen">
  <form class="admin-login-card" id="loginForm" novalidate>
    <p class="admin-login-eyebrow">ÁREA RESTRITA</p>
    <h1 class="admin-login-title">Painel de agendamentos</h1>

    <div class="booking-field">
      <label for="loginPassword">Senha</label>
      <input type="password" id="loginPassword" name="loginPassword" required autocomplete="current-password">
    </div>

    <button type="submit" class="btn btn-primary btn-large" id="loginBtn">Entrar</button>
    <p class="booking-message" id="loginMessage" role="status" aria-live="polite"></p>
  </form>
</section>

<!-- ===================== DASHBOARD ===================== -->
<section class="admin-dashboard" id="dashboard" hidden>
  <header class="admin-header">
    <span class="logo-text">Raquel Corrêa<em>Psicóloga</em></span>
    <div class="admin-header-actions">
      <span class="admin-live-dot" id="liveDot" title="Atualização automática ativa"></span>
      <button class="btn btn-outline btn-small" id="logoutBtn">Sair</button>
    </div>
  </header>

  <div class="admin-content">
    <div class="admin-toolbar">
      <h1 class="admin-title">Agendamentos</h1>
      <div class="admin-filters" id="filters">
        <button class="filter-btn is-active" data-filter="upcoming">Próximos</button>
        <button class="filter-btn" data-filter="done">Concluídos</button>
        <button class="filter-btn" data-filter="all">Todos</button>
      </div>
    </div>

    <p class="admin-empty" id="adminEmpty" hidden>Nenhum agendamento por aqui ainda.</p>

    <div class="appt-list" id="apptList"></div>
  </div>
</section>

<script type="module" src="js/admin.js"></script>
</body>
</html>
